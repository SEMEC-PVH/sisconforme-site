    const L=seg(t,4.0+h.k*.18,4.75+h.k*.18);const lift=Math.sin(Math.PI*L)*-16;h.roof.setAttribute('transform',`translate(0 ${lift.toFixed(2)})`);
    // water level
    const bottom=637+h.dy+2, top=(h.f?338:468)+h.dy;
    const e=eio(seg(t,2.35+h.k*.42,3.55+h.k*.42));
    const lvl=bottom+(top-bottom)*e;
    const amp=(e>0&&e<1?7:2.2)*(e>0?1:0)*(1+.6*Math.max(0,1-seg(t,4.6,6)));
    const ph=t*3.2+h.k*1.3;
    const x0=233+h.dx, x1=459+h.dx;
    if(e<=0){h.w.setAttribute('d','');h.hl.setAttribute('d','');}
    else{h.w.setAttribute('d',wave(x0,x1,lvl,amp,ph,bottom+4));h.hl.setAttribute('d',line(x0,x1,lvl,amp,ph));h.hl.setAttribute('stroke-opacity',(.9*cl(e*4)).toFixed(2))}
  });
  document.querySelectorAll('.rp').forEach((e,i)=>{const q=seg(t,3.85+i*.35,5.6+i*.35);const rx=40+q*720*(1+i*.15);e.setAttribute('rx',rx.toFixed(1));e.setAttribute('ry',(rx*.09).toFixed(1));e.setAttribute('stroke-width',(5-3*q).toFixed(2));e.setAttribute('stroke-opacity',(q>0&&q<1?(.55*(1-q)):0).toFixed(3))});
  // wordmark + reflection + tagline
  const w=eo(seg(t,4.5,5.5));document.getElementById('wrect').setAttribute('width',(w*2400).toFixed(1));
  document.getElementById('wm').style.opacity=cl(w*1.6);document.getElementById('lockup').setAttribute('transform',`translate(${((1-w)*498.6).toFixed(1)} 0) translate(263.4 252.4) scale(0.3866)`);
  const rf=eo(seg(t,4.2,6.0));document.getElementById('refl').setAttribute('opacity',(.9*rf).toFixed(3));
  document.getElementById('noff').setAttribute('dy',((t*22)%240).toFixed(1));
  const g=eo(seg(t,5.6,6.4));const tg=document.getElementById('tag');tg.setAttribute('opacity',g.toFixed(3));tg.setAttribute('transform',`translate(0 ${(1-g)*12})`);
};
const cap=location.hash==='#cap';
if(cap){document.documentElement.className='cap';render(0);}
else{let t0=performance.now();const D=8.5;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(now){const t=(now-t0)/1000;render(reduce?D:Math.min(t,D+30));requestAnimationFrame(loop)}requestAnimationFrame(loop);
  document.getElementById('replay').onclick=()=>{t0=performance.now()};}
</script></body></html>
